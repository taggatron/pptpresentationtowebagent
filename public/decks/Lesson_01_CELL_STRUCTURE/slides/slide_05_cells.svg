<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">We are all made of cells</title>
  <desc id="desc">A human silhouette connects to a magnified group of cells, showing that all living things are made of cells.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8fb"/><stop offset="1" stop-color="#f2f7df"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55b9d4"/><stop offset="1" stop-color="#2476aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#31576b" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1376" height="768" fill="url(#bg)"/>
  <text x="688" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" fill="#050505">We are all made of cells</text>
  <text x="688" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#31576b">Cells are the basic building blocks of every living organism.</text>
  <g transform="translate(230 238)" filter="url(#shadow)">
    <circle cx="120" cy="72" r="48" fill="#e58b3d"/><path d="M120 124 C56 124 25 190 31 271 L49 440 L191 440 L209 271 C215 190 184 124 120 124Z" fill="#e58b3d"/>
    <path d="M73 200 C18 227 0 284 7 350" fill="none" stroke="#c5682c" stroke-width="31" stroke-linecap="round"/><path d="M167 200 C222 227 240 284 233 350" fill="none" stroke="#c5682c" stroke-width="31" stroke-linecap="round"/>
    <path d="M83 438 L49 563" stroke="#31576b" stroke-width="34" stroke-linecap="round"/><path d="M157 438 L191 563" stroke="#31576b" stroke-width="34" stroke-linecap="round"/>
    <text x="120" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#31576b">YOU</text>
  </g>
  <path d="M480 430 C570 430 600 330 665 330" fill="none" stroke="#31576b" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 16"/><path d="M646 307 L686 330 L646 353" fill="none" stroke="#31576b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(690 222)" filter="url(#shadow)">
    <circle cx="150" cy="150" r="135" fill="#dcefc9" stroke="#5e8e55" stroke-width="7"/>
    <g fill="url(#cell)" stroke="#15547c" stroke-width="5"><circle cx="95" cy="94" r="42"/><circle cx="185" cy="92" r="47"/><circle cx="132" cy="174" r="50"/><circle cx="219" cy="181" r="39"/><circle cx="73" cy="213" r="35"/></g>
    <g fill="#d8f3fa" opacity=".95"><circle cx="95" cy="94" r="13"/><circle cx="185" cy="92" r="15"/><circle cx="132" cy="174" r="16"/><circle cx="219" cy="181" r="12"/><circle cx="73" cy="213" r="11"/></g>
  </g>
  <text x="1000" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#31576b">TRILLIONS OF CELLS</text><text x="1000" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#31576b">working together in an organism</text>
  <rect x="748" y="644" width="468" height="58" rx="29" fill="#e58b3d"/><text x="982" y="683" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#fff">CELL = UNIT OF LIFE</text>
</svg>

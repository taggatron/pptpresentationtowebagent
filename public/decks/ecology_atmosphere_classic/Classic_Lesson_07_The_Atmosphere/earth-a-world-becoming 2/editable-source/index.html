<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth · A world becoming</title>
<meta name="description" content="An immersive, interactive journey through volcanic Earth, the first oceans, the greening of land and the rise of animal life.">
<meta name="theme-color" content="#03080e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23156479'/%3E%3Cpath d='M6 11l8-6 6 6-5 7-8-1m12 3 7-6-1 10-6 4' fill='%237dc998'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="experience" aria-label="Earth through time: four interactive chapters">
<h1 class="sr-only">Earth: a world becoming</h1>
<canvas id="space" aria-hidden="true"></canvas>
<div class="cosmic-haze" aria-hidden="true"></div>
<div id="world">
  <div class="halo" aria-hidden="true"></div>
  <div class="planet-art"><img id="earth-image" src="assets/earth.png" alt="A realistic miniature Earth blending four eras: volcanoes at upper left, stormy oceans at upper right, forests at lower right and early animals at lower left."><img id="barren-fallback" src="assets/earth-barren.png" alt="" aria-hidden="true"></div>
  <canvas id="effects" aria-hidden="true"></canvas>
  <div id="quadrants" role="group" aria-label="Choose a chapter">
    <button class="quadrant volcanic" data-phase="0" aria-label="Volcanic Earth: animate eruptions and flowing lava" aria-pressed="false"><span class="marker"><span class="chapter-number">01</span><span class="chapter-label">Volcanic Earth</span><span class="marker-dot"></span></span></button>
    <button class="quadrant ocean" data-phase="1" aria-label="The first oceans: animate heavy rain and flooding" aria-pressed="false"><span class="marker"><span class="chapter-number">02</span><span class="chapter-label">The first oceans</span><span class="marker-dot"></span></span></button>
    <button class="quadrant green" data-phase="2" aria-label="A greener planet: animate plants and trees growing" aria-pressed="false"><span class="marker"><span class="chapter-number">03</span><span class="chapter-label">A greener planet</span><span class="marker-dot"></span></span></button>
    <button class="quadrant animals" data-phase="3" aria-label="Life steps ashore: animate animal evolution and movement from sea to land" aria-pressed="false"><span class="marker"><span class="chapter-number">04</span><span class="chapter-label">Life steps ashore</span><span class="marker-dot"></span></span></button>
  </div>
</div>
<section id="story" aria-labelledby="story-title" hidden>
  <button id="close-story" class="icon-button" aria-label="Close chapter">×</button>
  <div class="chapter-meta"><span id="chapter-count">CHAPTER 01</span><span class="small-line"></span><span id="era"></span></div>
  <h2 id="story-title"></h2><p id="story-intro"></p>
  <div id="facts"></div>
  <p id="science-note"></p>
  <div class="story-actions"><button id="replay" aria-label="Replay chapter animation"><span aria-hidden="true">↻</span> Replay</button><button id="next">Next chapter <span aria-hidden="true">↗</span></button></div>
  <div class="chapter-progress" aria-hidden="true"><span id="chapter-progress"></span></div>
</section>
<div id="invitation"><p>A world becoming.</p><span>Choose a region. Bring its story to life.</span></div>
<div class="instruments" role="group" aria-label="Experience controls">
  <button id="journey" class="journey-button"><span id="journey-symbol" aria-hidden="true">▷</span><span id="journey-label">Play the journey</span></button>
  <span class="control-divider" aria-hidden="true"></span>
  <button id="motion" class="icon-button" aria-label="Pause animations" title="Pause animations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
  <button id="sound" class="icon-button" aria-label="Mute sound" aria-pressed="true" title="Sound on after selecting a chapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4ZM15 8q5 4 0 8m3-11q8 7 0 14"/></svg></button>
  <button id="fullscreen" class="icon-button" aria-label="Enter full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
</div>
<div id="status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main>
<script src="sun.js"></script>
<script src="scene.js"></script>
</body></html>

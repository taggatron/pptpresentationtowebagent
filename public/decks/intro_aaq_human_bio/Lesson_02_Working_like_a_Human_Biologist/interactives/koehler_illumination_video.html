<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List the stages in obtaining Köhler illumination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #f0f7ff 0%, #e2effe 60%, #d4e7fa 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Subtle blueprint grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(2, 132, 199, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(2, 132, 199, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1376px;
      height: 100%;
      max-height: 768px;
      padding: 28px 56px 20px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4px;
    }

    h1.title {
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 800;
      color: #091e42;
      letter-spacing: -0.025em;
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .video-container {
      position: relative;
      width: min(940px, 92vw);
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 48px -8px rgba(15, 23, 42, 0.22), 0 12px 20px -6px rgba(15, 23, 42, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: #020617;
      margin: 10px 0;
      flex-shrink: 1;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .footer-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .fallback-link {
      font-size: 12.5px;
      color: #475569;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: color 0.15s ease;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(203, 213, 225, 0.6);
    }

    .fallback-link:hover {
      color: #0284c7;
      border-color: #bae6fd;
      background: #ffffff;
      text-decoration: none;
    }

    .watermark {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 500;
    }

    .watermark svg {
      width: 14px;
      height: 14px;
      fill: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="slide-wrapper">
    <header class="header">
      <h1 class="title">List the stages in obtaining Köhler illumination</h1>
    </header>

    <div class="video-container" id="videoContainer">
      <iframe
        id="koehlerIframe"
        src="https://www.youtube-nocookie.com/embed/5MfZweoJ6A8?enablejsapi=1&rel=0&modestbranding=1"
        title="Koehler Illumination Microscope"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>

    <footer class="footer-bar">
      <a class="fallback-link" href="https://www.youtube.com/watch?v=5MfZweoJ6A8" target="_blank" rel="noopener noreferrer">
        <span>↗</span> <span>Open video on YouTube</span>
      </a>
      <div class="watermark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Gemini Notebook</span>
      </div>
    </footer>
  </div>

  <script>
    // Handle messages from host slide presentation
    window.addEventListener("message", (event) => {
      if (!event.data) return;
      const iframe = document.getElementById("koehlerIframe");
      if (!iframe || !iframe.contentWindow) return;

      // When slide navigates away, pause video
      if (event.data.type === "SLIDE_CHANGED" || event.data.action === "pause") {
        try {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        } catch (_) {}
      }
    });
  </script>
</body>
</html>

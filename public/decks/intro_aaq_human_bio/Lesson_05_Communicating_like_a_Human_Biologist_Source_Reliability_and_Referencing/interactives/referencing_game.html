<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RefMaster | Academic Referencing Interactive Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: "Inter", -apple-system, sans-serif;
    }
    .wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      height: 48px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #312e81;
      color: #a5b4fc;
      border: 1px solid #4338ca;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.06em;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .game-name {
      font-weight: 700;
      color: #ffffff;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .btn-external {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn-external:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .frame-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header-bar">
      <div class="title-group">
        <span class="badge">OCR Level 3 Human Biology</span>
        <span class="game-name">RefMaster Academic Referencing Masterclass Game</span>
      </div>
      <div>
        <a href="https://taggatron.github.io/Referencinggame/" target="_blank" rel="noopener noreferrer" class="btn-external">
          Open Fullscreen in New Tab ↗
        </a>
      </div>
    </div>
    <div class="frame-container">
      <iframe id="refmaster-frame" src="https://taggatron.github.io/Referencinggame/" allow="clipboard-write"></iframe>
    </div>
  </div>
</body>
</html>

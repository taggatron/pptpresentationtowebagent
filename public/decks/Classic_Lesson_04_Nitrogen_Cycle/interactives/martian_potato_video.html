<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why does Matt Damon put his potatoes in poo? - The Martian Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #f0f7ff 0%, #e2effe 60%, #d4e7fa 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1376px;
      height: 100%;
      max-height: 768px;
      padding: 24px 48px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header {
      text-align: center;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e0f2fe;
      color: #0284c7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 12px;
      border-radius: 9999px;
      border: 1px solid #bae6fd;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    h1.title-question {
      font-size: clamp(24px, 3.2vw, 36px);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .video-container {
      position: relative;
      width: min(880px, 90vw);
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 35px -5px rgba(15, 23, 42, 0.22), 0 10px 15px -5px rgba(15, 23, 42, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: #020617;
      margin: 8px 0;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .footer-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .fallback-link {
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .fallback-link:hover {
      color: #0284c7;
      text-decoration: underline;
    }

    .watermark {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .watermark svg {
      width: 14px;
      height: 14px;
      fill: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="slide-wrapper">
    <header class="header">
      <span class="badge">Inquiry Video Hook</span>
      <h1 class="title-question">Why does Matt Damon put his potatoes in poo?</h1>
    </header>

    <div class="video-container" id="videoContainer">
      <iframe
        id="martianIframe"
        src="https://www.youtube-nocookie.com/embed/DKd6-ugozkA?enablejsapi=1&rel=0&modestbranding=1"
        title="The Martian Clip - Planting Potatoes (2015)"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>

    <footer class="footer-bar">
      <a class="fallback-link" href="https://www.youtube.com/watch?v=DKd6-ugozkA" target="_blank" rel="noopener noreferrer">
        <span>↗</span> <span>Open clip on YouTube</span>
      </a>
      <div class="watermark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Gemini Notebook</span>
      </div>
    </footer>
  </div>

  <script>
    // Handle messages from host slide presentation
    window.addEventListener("message", (event) => {
      if (!event.data) return;
      const iframe = document.getElementById("martianIframe");
      if (!iframe || !iframe.contentWindow) return;

      // When slide navigates away, pause video
      if (event.data.type === "SLIDE_CHANGED" || event.data.action === "pause") {
        try {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        } catch (_) {}
      }
    });
  </script>
</body>
</html>

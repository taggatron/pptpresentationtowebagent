<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Explore polygenic inheritance: watch genes and environment shape a population's height in an interactive Galton board." />
    <title>Height by Many Small Steps · The Variation Lab</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get('theme') || localStorage.getItem('variation-lab-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
